name: Catalog audit (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest aiohttp
      - name: Generate catalog
        run: python tools/sync_platform_catalog.py --catalog pryx_comfyui_higgsfield/catalog/models.json --snapshot _TMP/public-models.json --summary
      - name: Validate every model and request contract
        run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate frontend controls
        run: node --test tests/dynamic_widgets.test.cjs tests/reference_preview.test.cjs tests/settings_credentials.test.cjs
      - name: Save reviewed-release candidate and public snapshot
        uses: actions/upload-artifact@v4
        with:
          name: higgsfield-model-audit
          path: |
            pryx_comfyui_higgsfield/catalog/models.json
            _TMP/public-models.json
